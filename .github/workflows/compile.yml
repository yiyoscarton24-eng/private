name: Compilar YiyoOverlay

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Configurar CMake
      uses: lukka/get-cmake@latest

    - name: Compilar DLL
      run: |
        mkdir build
        cd build
        cmake .. -A x64
        cmake --build . --config Release

    - name: Subir DLL Compilada
      uses: actions/upload-artifact@v4.4.3
      with:
        name: YiyoOverlay-DLL
        path: |
          build/bin/Release/YiyoOverlay.dll
          build/Release/YiyoOverlay.dll
