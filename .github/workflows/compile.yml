name: Compilar YiyoOverlay

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    - name: Configurar CMake
      uses: lukka/get-cmake@latest

    - name: Generar y Compilar DLL (x64)
      run: |
        cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Subir DLL Compilada
      uses: actions/upload-artifact@v4.4.3
      with:
        name: YiyoOverlay-DLL
        path: |
          build/bin/Release/YiyoOverlay.dll
          build/Release/YiyoOverlay.dll
          build/bin/YiyoOverlay.dll
